<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sandyehgs — Link In Bio</title>
    <meta name="description" content="Link in bio sederhana untuk Mini App">
    <style>
      :root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--text:#e6eef6;--muted:#9aa4b2}
      *{box-sizing:border-box}
      html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Helvetica,Arial,-apple-system}
      body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071022 0%, #051426 100%);color:var(--text);padding:24px}
      .wrap{width:100%;max-width:420px}
      .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));padding:28px;border-radius:16px;text-align:center;box-shadow:0 10px 30px rgba(2,6,23,0.6)}
      .avatar{width:120px;height:120px;border-radius:999px;object-fit:cover;border:3px solid rgba(255,255,255,0.04);margin:0 auto 14px;display:block}
      h1{margin:6px 0 0;font-size:22px}
      p.bio{margin:8px 0 18px;color:var(--muted);font-size:14px}
      .links{display:flex;flex-direction:column;gap:12px}
      .link{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:12px;background:linear-gradient(90deg,var(--accent),#10b981);color:#042027;font-weight:700;text-decoration:none}
      .link.secondary{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--text);font-weight:600}
      .small{margin-top:14px;color:var(--muted);font-size:13px}
      footer{margin-top:18px;text-align:center;color:rgba(255,255,255,0.28);font-size:12px}
      @media (max-width:420px){.card{padding:20px}.avatar{width:96px;height:96px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card" role="main">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/93307728?s=400&v=4" alt="Avatar Sandyehgs">
        <h1>Sandyehgs</h1>
        <p class="bio">Mini app & bot Telegram — link sederhana untuk kontak, demo, dan source.</p>

        <nav class="links" aria-label="Link utama">
          <!-- Ganti href sesuai kebutuhan -->
          <a class="link" href="https://replit.com/@SandiHugos/Mini-Bio-Link" target="_blank" rel="noopener">Lihat Demo</a>
          <a class="link secondary" href="https://github.com/Sandyehgs/Mini-Bio-Link" target="_blank" rel="noopener">Source di GitHub</a>
          <a class="link secondary" href="mailto:you@example.com">Hubungi (Email)</a>
          <a class="link secondary" href="https://t.me/YourBotUsername" target="_blank" rel="noopener">Chat Bot Telegram</a>
          <a class="link secondary" href="https://example.com" target="_blank" rel="noopener">Link Tambahan</a>
        </nav>

        <p class="small">Untuk mengganti link: edit file index.html di repo atau beri saya daftar 3–6 link yang ingin ditampilkan.</p>
      </section>

      <footer>
        &copy; 2026 Sandyehgs
      </footer>
    </main>
  </body>
</html>
