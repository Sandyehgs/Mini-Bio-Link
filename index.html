<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sandyehgs — Link In Bio</title>
    <meta name="description" content="Link in bio sederhana untuk Mini App">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="wrap">
      <section class="card" role="main">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/93307728?s=400&v=4" alt="Avatar">

        <nav class="links" aria-label="Link utama">
          <!-- Ganti href sesuai kebutuhan -->
          <a class="link" href="https://replit.com/@SandiHugos/Mini-Bio-Link" target="_blank" rel="noopener">Lihat Demo</a>
          <a class="link secondary" href="https://github.com/Sandyehgs/Mini-Bio-Link" target="_blank" rel="noopener">Source di GitHub</a>
          <a class="link secondary" href="mailto:you@example.com">Hubungi (Email)</a>
          <a class="link secondary" href="https://t.me/YourBotUsername" target="_blank" rel="noopener">Chat Bot Telegram</a>
          <a class="link secondary" href="https://example.com" target="_blank" rel="noopener">Link Tambahan</a>
        </nav>

        <!-- Trakteer overlay script (menggantikan instruksi edit manual) -->
        <div id="trakteer-overlay"></div>
        <script type='text/javascript' src='https://edge-cdn.trakteer.id/js/trbtn-overlay.min.js?v=14-05-2025'></script>
        <script type='text/javascript' class='troverlay'>(function() {var trbtnId = trbtnOverlay.init('Trakteer','#be1e2d','https://trakteer.id/v1/carramellabela/tip/embed/modal','https://edge-cdn.trakteer.id/images/embed/trbtn-icon.png?v=14-05-2025','40','inline');trbtnOverlay.draw(trbtnId);})();</script>

      </section>

      <footer>
        &copy; 2026
      </footer>
    </main>
  </body>
</html>
